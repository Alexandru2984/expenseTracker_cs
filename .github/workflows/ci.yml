name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

# Least privilege by default; the docker job opts into packages: write.
permissions:
  contents: read

# Cancel superseded runs on the same ref (a new push cancels the previous CI).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_API: ${{ github.repository }}/api
  IMAGE_UI: ${{ github.repository }}/ui

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: expense_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d expense_test"
          --health-interval 5s --health-timeout 5s --health-retries 12

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: "10.0.x"

      - name: Verify Compose pins and database environment isolation
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Restore dependencies
        run: dotnet restore ExpenseTracker.sln -p:NuGetAuditMode=all -warnaserror:NU1901,NU1902,NU1903,NU1904

      - name: Build
        run: dotnet build ExpenseTracker.sln --no-restore -c Release

      - name: Test
        env:
          EXPENSE_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=expense_test;Username=postgres;Password=isolated-ci-password
        run: dotnet test ExpenseTracker.sln --no-build -c Release --verbosity normal

      - name: Setup Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: expense-tracker-ui/package-lock.json

      - name: Install frontend deps
        working-directory: expense-tracker-ui
        run: npm ci --ignore-scripts

      - name: Build frontend
        working-directory: expense-tracker-ui
        run: npm run build

      - name: Audit frontend dependencies
        working-directory: expense-tracker-ui
        run: npm audit --audit-level=low

      - name: Install Chromium for isolated connector UI checks
        working-directory: expense-tracker-ui
        run: npx --no-install playwright install --with-deps chromium

      - name: Connector UI, mobile and accessibility
        working-directory: expense-tracker-ui
        run: npm run test:finance

      - name: Dashboard, light/dark, mobile, sessions and accessibility
        working-directory: expense-tracker-ui
        run: npm run test:dashboard

      - name: Cross-tab identity, cookie ordering and browser fallbacks
        working-directory: expense-tracker-ui
        run: npm run test:sessions

      - name: Savings goals, contribution retries, mobile and accessibility
        working-directory: expense-tracker-ui
        run: npm run test:goals

      - name: Notification consent, privacy, mobile and accessibility
        working-directory: expense-tracker-ui
        run: npm run test:notifications

      - name: MFA enrollment, recovery, login, mobile and accessibility
        working-directory: expense-tracker-ui
        run: npm run test:mfa

      - name: Account archive, deletion, session boundaries, mobile and accessibility
        working-directory: expense-tracker-ui
        run: npm run test:account-data

      - name: Upload isolated browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/ci/
            .artifacts/screenshots/
          # Only the two synthetic browser-output directories above are included.
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-and-test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (API)
        id: meta-api
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_API }}

      - name: Build & push API image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: ./ExpenseTracker.Api
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          build-args: VCS_REF=${{ github.sha }}

      - name: Extract metadata (UI)
        id: meta-ui
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_UI }}

      - name: Build & push UI image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: ./expense-tracker-ui
          push: true
          tags: ${{ steps.meta-ui.outputs.tags }}
          labels: ${{ steps.meta-ui.outputs.labels }}
          build-args: VCS_REF=${{ github.sha }}
